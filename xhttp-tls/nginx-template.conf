# XHTTP + TLS for SERVER_NAME
# nginx terminates TLS on 443, serves the decoy site, and forwards the
# XHTTP path to Xray on 127.0.0.1:10443 (h2c, security "none" in Xray).
# Requires nginx >= 1.25.1 (for "http2 on;").

# HTTP: ACME challenges for certificate renewal, everything else -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Any TLS handshake with an unknown SNI (or scanners hitting the bare IP) is dropped
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name SERVER_NAME;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/SERVER_NAME/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SERVER_NAME/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/decoy;
    index index.html;
    error_page 404 /404.html;

    # XHTTP -> Xray
    location /api/v2/telemetry/ {
        client_max_body_size 0;
        client_body_timeout 5m;
        grpc_pass grpc://127.0.0.1:10443;
        grpc_buffer_size 16k;
        grpc_socket_keepalive on;
        grpc_read_timeout 1h;
        grpc_send_timeout 1h;
        grpc_set_header Host $host;
        grpc_set_header X-Real-IP $remote_addr;
        grpc_set_header X-Forwarded-For $remote_addr;
    }

    location = /404.html {
        internal;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
