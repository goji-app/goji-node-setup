<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Window — live cameras from around the world</title>
  <meta name="description" content="Live streams from city squares, zoos, aquariums, wildlife reserves and the International Space Station, all in one place.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { --bg:#0e1116; --panel:#151a21; --line:#242c36; --fg:#eef2f6; --muted:#98a4b3; --accent:#e8eef5; --live:#e5484d; }
    :root[data-theme="light"] { --bg:#f5f6f8; --panel:#fff; --line:#dfe3e8; --fg:#12171d; --muted:#5d6874; --accent:#12171d; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
    a { color:inherit; text-decoration:none; }
    button { font:inherit; color:inherit; }
    .wrap { max-width:1280px; margin:0 auto; padding:0 24px; }
    header { border-bottom:1px solid var(--line); background:var(--bg); position:sticky; top:0; z-index:5; }
    header .wrap { display:flex; align-items:center; gap:28px; height:58px; }
    .logo { font-weight:700; letter-spacing:-.01em; font-size:18px; display:flex; align-items:center; gap:9px; }
    .logo i { width:9px; height:9px; border-radius:50%; background:var(--live); display:inline-block; }
    nav { display:flex; gap:20px; }
    nav button { background:none; border:0; padding:6px 0; color:var(--muted); cursor:pointer; font-size:14px; border-bottom:2px solid transparent; }
    nav button:hover { color:var(--fg); }
    nav button[aria-pressed="true"] { color:var(--fg); border-bottom-color:var(--fg); }
    .search { margin-left:auto; }
    .search input { width:230px; padding:7px 12px; background:var(--panel); border:1px solid var(--line); border-radius:6px; color:var(--fg); font:inherit; font-size:14px; }
    .search input:focus { outline:1px solid var(--muted); }
    @media (max-width:760px) { nav { display:none; } .search { flex:1; } .search input { width:100%; } }
    .stage { display:grid; grid-template-columns:minmax(0,1fr) 360px; gap:28px; padding:26px 0 10px; }
    @media (max-width:1000px) { .stage { grid-template-columns:1fr; } }
    .player { position:relative; aspect-ratio:16/9; background:#000; border-radius:8px; overflow:hidden; }
    .player iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
    .pmsg { position:absolute; left:0; right:0; bottom:0; z-index:3; padding:10px 14px; background:rgba(14,17,22,.88); color:#fff; font-size:13px; display:flex; gap:12px; align-items:center; justify-content:space-between; }
    .pmsg button { background:#fff; color:#12171d; border:0; border-radius:5px; padding:5px 12px; cursor:pointer; font-size:12px; font-weight:600; }
    .off .th { filter:grayscale(1) brightness(.6); }
    .tag.o { background:#555; }
    .poster { position:absolute; inset:0; width:100%; height:100%; padding:0; border:0; cursor:pointer; background:#000 center/cover no-repeat; }
    .poster::after { content:""; position:absolute; inset:0; background:linear-gradient(to top,rgba(0,0,0,.55),rgba(0,0,0,0) 45%); }
    .poster .pl { position:absolute; z-index:1; left:50%; top:50%; width:72px; height:72px; margin:-36px 0 0 -36px; border-radius:50%; background:rgba(14,17,22,.62); border:1.5px solid rgba(255,255,255,.85); }
    .poster .pl::after { content:""; position:absolute; left:28px; top:22px; border-left:21px solid #fff; border-top:13px solid transparent; border-bottom:13px solid transparent; }
    .poster:hover .pl { background:rgba(14,17,22,.8); }
    .info { padding:16px 0 4px; }
    .info .k { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:13px; }
    .tag { display:inline-flex; align-items:center; gap:6px; background:var(--live); color:#fff; font-size:11px; font-weight:700; letter-spacing:.07em; padding:2px 7px; border-radius:3px; }
    .info h1 { margin:8px 0 6px; font-size:26px; line-height:1.2; letter-spacing:-.015em; }
    .info p { margin:0 0 14px; color:var(--muted); max-width:720px; }
    .btns { display:flex; gap:8px; flex-wrap:wrap; }
    .btn { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:6px 14px; cursor:pointer; font-size:13px; }
    .btn:hover { border-color:var(--muted); }
    aside h2 { margin:0 0 12px; font-size:12px; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); font-weight:600; }
    .next { display:flex; flex-direction:column; gap:12px; }
    @media (min-width:1001px) { .next { max-height:620px; overflow:auto; padding-right:6px; } }
    .row { display:flex; gap:12px; background:none; border:0; padding:0; text-align:left; cursor:pointer; }
    .row .th { flex:0 0 150px; aspect-ratio:16/9; border-radius:5px; overflow:hidden; position:relative; background:#1b222b center/cover no-repeat; }
    .row .th .tag { position:absolute; left:5px; top:5px; font-size:9px; padding:1px 5px; }
    .row b { display:block; font-size:14px; line-height:1.3; font-weight:600; }
    .row small { color:var(--muted); font-size:12px; }
    .row:hover b { text-decoration:underline; }
    .row[aria-current="true"] b { color:var(--live); }
    .bar { display:flex; align-items:baseline; justify-content:space-between; margin:30px 0 14px; border-top:1px solid var(--line); padding-top:22px; }
    .bar h2 { margin:0; font-size:20px; letter-spacing:-.01em; }
    .bar span { color:var(--muted); font-size:13px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:24px 20px; padding-bottom:48px; }
    .card { background:none; border:0; padding:0; text-align:left; cursor:pointer; display:block; width:100%; }
    .card .th { aspect-ratio:16/9; border-radius:8px; overflow:hidden; position:relative; background:#1b222b center/cover no-repeat; }
    .card .th .tag { position:absolute; left:9px; top:9px; }
    .card .th::after { content:""; position:absolute; inset:0; box-shadow:inset 0 0 0 1px rgba(255,255,255,.06); border-radius:8px; }
    .card:hover .th { filter:brightness(1.08); }
    .card b { display:block; margin-top:10px; font-size:15px; line-height:1.3; font-weight:600; }
    .card small { color:var(--muted); font-size:13px; }
    .empty { color:var(--muted); padding:20px 0 60px; }
    footer { border-top:1px solid var(--line); padding:26px 0 40px; color:var(--muted); font-size:13px; }
    footer .wrap { display:flex; justify-content:space-between; gap:24px; flex-wrap:wrap; }
    footer p { margin:0; max-width:760px; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <a class="logo" href="/"><i></i>Open Window</a>
      <nav id="nav" aria-label="Categories"></nav>
      <label class="search"><input id="q" type="search" placeholder="Search" aria-label="Search" autocomplete="off"></label>
    </div>
  </header>

  <main class="wrap">
    <section class="stage">
      <div>
        <div class="player" id="player"></div>
        <div class="info">
          <div class="k"><span class="tag">LIVE</span><span id="m-cat"></span><span>·</span><span id="m-src"></span></div>
          <h1 id="m-title"></h1>
          <p id="m-desc"></p>
          <div class="btns">
            <button class="btn" id="fs" type="button">Full screen</button>
            <button class="btn" id="share" type="button">Copy link</button>
          </div>
        </div>
      </div>
      <aside>
        <h2>Up next</h2>
        <div class="next" id="next"></div>
      </aside>
    </section>

    <div class="bar"><h2 id="sec">All cameras</h2><span id="cnt"></span></div>
    <section class="grid" id="grid"></section>
    <div class="empty" id="empty" hidden>Nothing found.</div>
  </main>

  <footer>
    <div class="wrap">
      <p>Open Window collects public live broadcasts in one place. Every stream belongs to the channel credited next to it; availability and schedules are set by the broadcaster, and a camera may be offline at times.</p>
      <span>© <span id="y">2026</span> Open Window</span>
    </div>
  </footer>

  <script>
  (function () {
    // v = YouTube video id of the broadcast. Every id below was checked as embeddable on YouTube (oEmbed).
    // Only YouTube is used. If a stream turns out to be unavailable, the player says so and moves on to the next one.
    var S = [
      { id:'iss',        cat:'space',    v:'M3HKLzjvKPc', t:'International Space Station — live from orbit', by:'NASA',
        d:'Live video from cameras on the International Space Station, the official NASA stream.' },
      { id:'times-sq',   cat:'city',     v:'VGnFLdQW39A', t:'New York — Times Square and the skyline', by:'FOX 5 New York',
        d:'A 24/7 live camera over Times Square, the Manhattan skyline and the streets around them.' },
      { id:'crossroads', cat:'city',     v:'z-jYdOIKcTQ', t:'Times Square Crossroads — New York City', by:'EarthCam',
        d:'EarthCam’s live view of the Times Square crossroads in New York City.' },
      { id:'venice',     cat:'city',     v:'a1mcaV3Sf9U', t:'Venice — rolling live cam', by:'I Love You Venice',
        d:'A rolling live cam on Venice, Italy: the lagoon, canals and rooftops.' },
      { id:'shibuya',    cat:'city',     v:'dfVK7ld38Ys', t:'Tokyo — Shibuya Scramble Crossing', by:'FNN Prime Online',
        d:'The famous Shibuya Scramble Crossing in Tokyo, live.' },
      { id:'shibuya-2',  cat:'city',     v:'2TrGSO2ZQ_Q', t:'Tokyo — Shibuya Scramble Crossing, second view', by:'Shibuya Television',
        d:'A second live angle on the Shibuya Scramble Crossing in Tokyo.' },
      { id:'stl-zoo',    cat:'zoo',      v:'b8RCVeXUYMY', t:'Saint Louis Zoo — live stream', by:'Saint Louis Zoo',
        d:'The Saint Louis Zoo’s own live stream from the zoo grounds.' },
      { id:'africa',     cat:'wildlife', v:'vr4o_AsrU1k', t:'African waterholes — Wild Africa Live', by:'Africam',
        d:'Live cameras at African waterholes: wild animals come and go through the day.' },
      { id:'elephants',  cat:'wildlife', v:'0P_LBKqVbfs', t:'Elephants — Tembe Elephant Park, South Africa', by:'Explore Live Nature Cams',
        d:'A live elephant cam in Tembe Elephant Park, South Africa.' },
      { id:'jelly-pac',  cat:'aquarium', v:'IYG9fnz40-E', t:'Jellyfish — Aquarium of the Pacific', by:'explore.org',
        d:'Moon jellies drifting in the tank at the Aquarium of the Pacific, live.' },
      { id:'sharks',     cat:'aquarium', v:'o41HD4IiWoA', t:'Sharks and friends — aquarium cams', by:'EarthCam',
        d:'EarthCam’s live view of sharks and other fish in a large aquarium.' },
      { id:'iss-hd',     cat:'space',    v:'awQzjn72bI0', t:'ISS — high-definition views of Earth', by:'NASA',
        d:'Live high-definition views from the International Space Station, the official NASA stream.' },
      { id:'nasa-live',  cat:'space',    v:'P11y8N22Rq0', t:'NASA Live — official stream of NASA TV', by:'NASA',
        d:'NASA TV’s media channel: launches, spacewalks, briefings and mission coverage.' },
      { id:'abbey-road', cat:'city',     v:'zMCea32gpmg', t:'London — Abbey Road crossing', by:'EarthCam',
        d:'The famous zebra crossing on Abbey Road in London, live.' },
      { id:'jackson',    cat:'city',     v:'1EiC9bvVGnk', t:'Jackson Hole — Town Square', by:'See Jackson Hole',
        d:'A live view of the Town Square in Jackson, Wyoming, with the elk-antler arches.' },
      { id:'monterey',   cat:'aquarium', v:'fuCeRkeDxtQ', t:'Monterey Bay — open sea tank', by:'Monterey Bay Aquarium',
        d:'The Monterey Bay Aquarium’s live cam of the open-sea exhibit.' },
      { id:'otters',     cat:'aquarium', v:'JQnxefImhu8', t:'Sea otters — Monterey Bay Aquarium', by:'Monterey Bay Aquarium',
        d:'Live sea otter cam at the Monterey Bay Aquarium.' },
      { id:'france24',   cat:'news',     v:'HvZt-nh9sGg', t:'FRANCE 24 English — live news', by:'FRANCE 24 English',
        d:'International breaking news and top stories, 24/7.' },
      { id:'sky',        cat:'news',     v:'xDWQ3LkccY8', t:'Sky News — live', by:'Sky News',
        d:'Sky News live: breaking news and analysis from the UK and around the world.' },
      { id:'dw',         cat:'news',     v:'LuKwFajn37U', t:'DW News — live', by:'DW News',
        d:'Headline news from around the world from Deutsche Welle.' },
      { id:'euronews',   cat:'news',     v:'pykpO5kQJ98', t:'Euronews English — live', by:'Euronews',
        d:'Live European and world news in English.' },
      { id:'aje',        cat:'news',     v:'yYO1EwNbgcQ', t:'Al Jazeera English — live', by:'Al Jazeera English',
        d:'Al Jazeera English live stream.' },
      { id:'abc',        cat:'news',     v:'iipR5yUp36o', t:'ABC News Live — 24/7 news', by:'ABC News',
        d:'24/7 news, context and analysis from ABC News.' },
      { id:'bloomberg',  cat:'news',     v:'iEpJwprxDdk', t:'Bloomberg Business News — live', by:'Bloomberg Television',
        d:'Live business and markets news from Bloomberg Television.' }
    ];
    var CATS = [['all','All'],['city','Cities'],['space','Space'],['zoo','Zoos'],['wildlife','Wildlife'],['aquarium','Aquariums'],['news','News']];
    var LABEL = { city:'City', space:'Space', zoo:'Zoo', wildlife:'Wildlife', aquarium:'Aquarium', news:'News' };
    var $ = function (id) { return document.getElementById(id); };
    var thumb = function (s) { return 'https://i.ytimg.com/vi/' + s.v + '/hqdefault.jpg'; };
    function find(id) { for (var i = 0; i < S.length; i++) if (S[i].id === id) return S[i]; return S[0]; }
    function img(el, s) { el.style.backgroundImage = 'url(' + thumb(s) + ')'; }

    var tok = 0, wd = 0, apiState = 0, cbs = [];
    function flush(ok) { var c = cbs; cbs = []; c.forEach(function (f) { f(ok); }); }
    function loadApi(cb) {
      if (window.YT && YT.Player) { cb(true); return; }
      if (apiState === 3) { cb(false); return; }
      cbs.push(cb); if (apiState === 1) return; apiState = 1;
      window.onYouTubeIframeAPIReady = function () { apiState = 2; flush(true); };
      var sc = document.createElement('script'); sc.src = 'https://www.youtube.com/iframe_api';
      sc.onerror = function () { apiState = 3; flush(false); }; document.head.appendChild(sc);
      setTimeout(function () { if (apiState === 1) { apiState = 3; flush(false); } }, 7000);
    }
    function plain(mount, s) {
      var f = document.createElement('iframe');
      f.src = 'https://www.youtube-nocookie.com/embed/' + s.v + '?autoplay=1&mute=1&rel=0&playsinline=1';
      f.title = s.t; f.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
      f.setAttribute('allowfullscreen', ''); f.referrerPolicy = 'strict-origin-when-cross-origin';
      mount.innerHTML = ''; mount.appendChild(f);
    }
    function nextGood(s) {
      var i = S.indexOf(s);
      for (var k = 1; k < S.length; k++) { var n = S[(i + k) % S.length]; if (!n.bad) return n; }
      return null;
    }
    function msg(text, withBtn) {
      var old = document.getElementById('pmsg'); if (old) old.remove();
      if (!text) return;
      var d = document.createElement('div'); d.id = 'pmsg'; d.className = 'pmsg'; var sp = document.createElement('span'); sp.textContent = text; d.appendChild(sp);
      if (withBtn) { var b = document.createElement('button'); b.type = 'button'; b.textContent = 'Next stream';
        b.addEventListener('click', function () { var n = nextGood(cur); if (n) show(n.id, true, true); }); d.appendChild(b); }
      $('player').appendChild(d);
    }
    function fail(s, my) {
      if (my !== tok) return;
      s.bad = true; renderGrid(); renderNext();
      var n = nextGood(s);
      msg(n ? 'This stream is not available right now. Switching to the next one…' : 'This stream is not available right now.');
      if (n) setTimeout(function () { if (my === tok) show(n.id, true, true); }, 2200);
    }
    var cur = null, filter = 'all', query = '';
    function show(id, play, push) {
      var s = find(id); cur = s;
      $('m-title').textContent = s.t; $('m-desc').textContent = s.d; $('m-cat').textContent = LABEL[s.cat]; $('m-src').textContent = s.by;
      document.title = s.t + ' — Open Window';
      var box = $('player'); box.innerHTML = ''; tok++; clearTimeout(wd);
      if (play) {
        var mount = document.createElement('div'); mount.style.cssText = 'position:absolute;inset:0'; box.appendChild(mount);
        var my = tok;
        loadApi(function (ok) {
          if (my !== tok) return;
          if (ok) {
            try {
              var pv = { autoplay: 1, mute: 1, rel: 0, playsinline: 1 };
              if (/^https?:/.test(location.protocol)) pv.origin = location.origin;
              new YT.Player(mount, { host: 'https://www.youtube-nocookie.com', videoId: s.v, playerVars: pv, events: {
                onReady: function (e) { try { e.target.mute(); e.target.playVideo(); } catch (x) {} },
                onStateChange: function (e) { if (my === tok && (e.data === 1 || e.data === 3)) { clearTimeout(wd); msg(null); } },
                onError: function () { fail(s, my); }
              } });
              wd = setTimeout(function () { if (my === tok) msg('The stream is taking a while to start.', true); }, 15000);
              return;
            } catch (x) {}
          }
          plain(mount, s);
        });
      } else {
        var b = document.createElement('button'); b.className = 'poster'; b.type = 'button'; b.setAttribute('aria-label', 'Play: ' + s.t);
        img(b, s); b.innerHTML = '<span class="pl"></span>';
        b.addEventListener('click', function () { show(s.id, true, false); });
        box.appendChild(b);
      }
      if (push) { try { history.replaceState(null, '', '#' + s.id); } catch (e) {} }
      renderNext();
    }
    function mk(s, cls) {
      var b = document.createElement('button'); b.type = 'button'; b.className = cls;
      b.innerHTML = '<div class="th"><span class="tag' + (s.bad ? ' o' : '') + '">' + (s.bad ? 'OFFLINE' : 'LIVE') + '</span></div><div><b></b><small></small></div>';
      if (s.bad) b.className += ' off';
      img(b.querySelector('.th'), s);
      b.querySelector('b').textContent = s.t; b.querySelector('small').textContent = s.by + ' · ' + LABEL[s.cat];
      b.addEventListener('click', function () { show(s.id, true, true); window.scrollTo({ top: 0, behavior: 'smooth' }); });
      if (cls === 'row' && cur && cur.id === s.id) b.setAttribute('aria-current', 'true');
      return b;
    }
    function renderNext() {
      var n = $('next'); n.innerHTML = '';
      S.forEach(function (s) { if (!cur || s.id !== cur.id) n.appendChild(mk(s, 'row')); });
    }
    function renderGrid() {
      var g = $('grid'); g.innerHTML = ''; var q = query.toLowerCase(), c = 0;
      S.forEach(function (s) {
        if (filter !== 'all' && s.cat !== filter) return;
        if (q && (s.t + ' ' + s.d + ' ' + s.by + ' ' + LABEL[s.cat]).toLowerCase().indexOf(q) < 0) return;
        g.appendChild(mk(s, 'card')); c++;
      });
      $('empty').hidden = c > 0; $('cnt').textContent = c + (c === 1 ? ' camera' : ' cameras');
      $('sec').textContent = filter === 'all' ? 'All cameras' : CATS.filter(function (x) { return x[0] === filter; })[0][1];
    }
    function renderNav() {
      var w = $('nav'); w.innerHTML = '';
      CATS.forEach(function (c) {
        var b = document.createElement('button'); b.type = 'button'; b.textContent = c[1]; b.setAttribute('aria-pressed', filter === c[0] ? 'true' : 'false');
        b.addEventListener('click', function () { filter = c[0]; renderNav(); renderGrid(); });
        w.appendChild(b);
      });
    }
    $('q').addEventListener('input', function (e) { query = e.target.value; renderGrid(); });
    $('fs').addEventListener('click', function () { var p = $('player'); if (p.requestFullscreen) p.requestFullscreen().catch(function () {}); });
    $('share').addEventListener('click', function () {
      var u = location.href.split('#')[0] + '#' + (cur ? cur.id : ''), b = this;
      var done = function () { b.textContent = 'Link copied'; setTimeout(function () { b.textContent = 'Copy link'; }, 1800); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(u).then(done, function () {}); else done();
    });
    $('y').textContent = new Date().getFullYear();
    window.addEventListener('hashchange', function () { var h = location.hash.slice(1); if (h) show(h, true, false); });
    renderNav(); renderGrid();
    var h = location.hash.slice(1);
    show(h || 'iss', !!h, false);
  })();
  </script>
</body>
</html>
