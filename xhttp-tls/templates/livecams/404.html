<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Open Window</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #f3f7fa; --fg: #1d1d1f; --muted: #6b6b70; --accent: #1668a8; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0c1620; --fg: #ececee; --muted: #9a9aa2; --accent: #7fd1ff; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
      font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-align: center; padding: 20px; }
    h1 { font-size: 64px; margin: 0; letter-spacing: -0.03em; }
    p { color: var(--muted); margin: 8px 0 24px; }
    a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <div>
    <h1>404</h1>
    <p>This page doesn’t exist or has been moved.</p>
    <a href="/">← Back to Open Window</a>
  </div>
</body>
</html>
